{{define "title"}}{{t "Set up"}}{{end}}
{{define "content"}}
<div class="auth">
  {{template "auth-brand" .}}
  <div class="card">
    <h1>{{t "Welcome to Anchor"}}</h1>
    <p class="lead">{{t "Create the first account. It will be the administrator."}}</p>
    <form method="post" action="/setup">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>{{t "Username"}} <input name="username" value="{{.Username}}" required autocomplete="username" autofocus></label>
      <label>{{t "Password"}} <input type="password" name="password" required minlength="10" autocomplete="new-password">
        <span class="hint">{{t "At least %d characters." 10}}</span></label>
      <label>{{t "Confirm password"}} <input type="password" name="confirm" required minlength="10" autocomplete="new-password"></label>
      <button class="btn btn-primary">{{t "Create admin account"}}</button>
    </form>
  </div>
</div>
{{end}}
