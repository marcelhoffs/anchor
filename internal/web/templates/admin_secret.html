{{define "title"}}{{t "Admin"}}{{end}}
{{define "content"}}
<div class="card wide-card">
  <h1>{{t "Admin"}}</h1>
  {{template "admin-nav" .}}
  <section class="reveal" aria-labelledby="secret-title">
    <h2 id="secret-title">{{.SecretTitle}}</h2>
    <p class="muted">{{.Message}}</p>
    <div class="copy-row">
      <input id="secret" class="secret-field" readonly value="{{.Value}}" aria-label="{{.SecretTitle}}">
      <button type="button" class="btn" data-copy="secret" data-copied="{{t "Copied"}}" hidden>{{icon "copy" "sm"}}{{if eq .AdminTab "invites"}}{{t "Copy link"}}{{else}}{{t "Copy password"}}{{end}}</button>
      <span class="copy-status" role="status" data-copy-status></span>
    </div>
  </section>
  <div class="form-actions"><a class="btn btn-primary" href="{{if eq .AdminTab "invites"}}/admin/invites{{else}}/admin/users{{end}}">{{t "Done"}}</a></div>
</div>
{{end}}
{{define "scripts"}}<script src="{{asset "copy.js"}}"></script>{{end}}
