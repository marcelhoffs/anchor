{{define "title"}}{{t "Admin"}}{{end}}
{{define "content"}}
<div class="card wide-card">
  <h1>{{t "Admin"}}</h1>
  {{template "admin-nav" .}}
  <section class="reveal" aria-labelledby="secret-title">
    <h2 id="secret-title">{{.SecretTitle}}</h2>
    <p class="muted">{{.Message}}</p>
    <input class="secret-field" readonly value="{{.Value}}" aria-label="{{.SecretTitle}}">
  </section>
  <div class="form-actions"><a class="btn btn-primary" href="{{if eq .AdminTab "invites"}}/admin/invites{{else}}/admin/{{end}}">{{t "Done"}}</a></div>
</div>
{{end}}
