{{define "title"}}Tags{{end}}
{{define "content"}}
<section class="card">
  <h1>Tags</h1>
  {{if .Tags}}
  <p class="muted">Renaming a tag to one you already have merges the two.</p>
  <div class="table-wrap">
  <table>
    <thead><tr><th scope="col">Tag</th><th scope="col">Bookmarks</th><th scope="col">Rename or merge</th><th scope="col"><span class="visually-hidden">Delete</span></th></tr></thead>
    <tbody>
    {{range .Tags}}
      <tr>
        <td><a href="{{tagURL .Name}}">#{{.Name}}</a></td>
        <td>{{.Count}}</td>
        <td>
          <form method="post" action="/tags/{{.ID}}/rename" class="row">
            <input type="hidden" name="csrf" value="{{$.CSRF}}">
            <input name="name" value="{{.Name}}" aria-label="New name for {{.Name}}" required autocapitalize="none" spellcheck="false">
            <button>Rename</button>
          </form>
        </td>
        <td>
          <form method="post" action="/tags/{{.ID}}/delete">
            <input type="hidden" name="csrf" value="{{$.CSRF}}">
            <button class="link danger" aria-label="Delete tag {{.Name}}">Delete</button>
          </form>
        </td>
      </tr>
    {{end}}
    </tbody>
  </table>
  </div>
  {{else}}
  <p class="empty">No tags yet. Add some when you save a bookmark.</p>
  {{end}}
</section>
{{end}}
