{{define "title"}}{{display .Shared}}{{end}}
{{define "content"}}
<div class="card shared">
  {{with .Shared}}
  <p class="muted shared-kicker">{{icon "link" "sm"}}{{t "A bookmark shared from Anchor"}}</p>
  <h1><a href="{{.URL}}" rel="noopener noreferrer nofollow">{{display .}}</a></h1>
  <p class="domain">{{.Domain}}</p>
  {{with .Description}}<p class="shared-desc">{{.}}</p>{{end}}
  <a class="btn btn-primary" href="{{.URL}}" rel="noopener noreferrer nofollow">{{t "Open %s" .Domain}}</a>
  {{end}}
</div>
{{end}}
