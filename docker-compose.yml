services:
  anchor:
    image: ghcr.io/marcelhoffs/anchor:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    # All state (the database) lives in the named volume below. Docker
    # creates it owned by the container's user, so it needs no preparation.
    volumes: ["data:/data"]
    read_only: true
    # Settings live in .env; copy .env.example to get started.
    env_file: .env

volumes:
  data:
    # A fixed name, so backup and restore commands don't depend on the
    # directory this file is in.
    name: anchor-data
