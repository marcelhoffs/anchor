services:
  burrow:
    image: ghcr.io/marcelhoffs/burrow:latest
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    # A bind mount must be writable by UID 65532: sudo chown 65532:65532 ./data
    volumes: ["./data:/data"]
    read_only: true
    environment:
      BURROW_BASE_URL: https://burrow.example.com
      BURROW_SECRET_KEY: ${BURROW_SECRET_KEY}   # openssl rand -base64 32
      # BURROW_TRUSTED_PROXIES: 172.16.0.0/12   # your reverse proxy's network
